name: Docker Build, Test and Push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/postman/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build-push.yml"
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  api-tests:
    name: Build and run API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application images
        run: |
          docker compose build \
            monolith \
            movies-service \
            events-service \
            proxy-service

      - name: Start application
        run: |
          docker compose up -d --no-build \
            postgres \
            zookeeper \
            kafka \
            monolith \
            movies-service \
            events-service \
            proxy-service

      - name: Wait for application readiness
        shell: bash
        run: |
          wait_for_url() {
            local service_name="$1"
            local url="$2"

            for attempt in {1..90}; do
              if curl --fail --silent "$url" > /dev/null; then
                echo "$service_name is ready"
                return 0
              fi
              sleep 2
            done

            echo "::error::$service_name did not become ready: $url"
            return 1
          }

          wait_for_url "monolith" "http://127.0.0.1:8080/health"
          wait_for_url "movies-service" "http://127.0.0.1:8081/api/movies/health"
          wait_for_url "events-service" "http://127.0.0.1:8082/api/events/health"
          wait_for_url "proxy-service" "http://127.0.0.1:8000/health"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install API test dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Run Postman API tests
        working-directory: tests/postman
        run: npm run test:local

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: tests/postman/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-images:
    name: Publish ${{ matrix.image }}
    needs: api-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: monolith
            context: ./src/monolith
          - image: movies-service
            context: ./src/microservices/movies
          - image: events-service
            context: ./src/microservices/events
          - image: proxy-service
            context: ./src/microservices/proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'pull_request' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
